services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER={DATABASE_USER}
      - POSTGRES_PASSWORD={DATABASE_PASSWORD}
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nestjs-sandbox

volumes:
  postgres_data:

networks:
  nestjs-sandbox:
